<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Research Idea Survey</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%233a4fa0%22%2F%3E%3Crect%20x%3D%226%22%20y%3D%228%22%20width%3D%228%22%20height%3D%2216%22%20rx%3D%222%22%20fill%3D%22%23ffffff%22%2F%3E%3Crect%20x%3D%2218%22%20y%3D%228%22%20width%3D%228%22%20height%3D%2216%22%20rx%3D%222%22%20fill%3D%22%23ffffff%22%20opacity%3D%22.55%22%2F%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
  :root{
    --paper:#f4f5f7; --card:#fff; --sunk:#eceef2;
    --ink:#15181d; --ink2:#464c57; --ink3:#727a88;
    --rule:#d7dbe2; --rule2:#c2c8d2;
    --accent:#3a4fa0; --accent-soft:#e6e9f6;
    --warn:#a8630f; --good:#17705f;
    --a-side:#3a4fa0; --b-side:#8a4a86;
    --shadow:0 1px 2px rgba(21,24,29,.06), 0 6px 18px rgba(21,24,29,.05);
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --paper:#101319; --card:#171b22; --sunk:#1e232c;
    --ink:#e8eaee; --ink2:#b1b8c4; --ink3:#828b9a;
    --rule:#2a313c; --rule2:#39424f;
    --accent:#93a5ee; --accent-soft:#222a44;
    --warn:#e0a45c; --good:#61c9b1;
    --a-side:#93a5ee; --b-side:#d093cb;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  }}
  :root[data-theme="dark"]{
    --paper:#101319; --card:#171b22; --sunk:#1e232c;
    --ink:#e8eaee; --ink2:#b1b8c4; --ink3:#828b9a;
    --rule:#2a313c; --rule2:#39424f;
    --accent:#93a5ee; --accent-soft:#222a44;
    --warn:#e0a45c; --good:#61c9b1;
    --a-side:#93a5ee; --b-side:#d093cb;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--paper); color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
    font-size:15px; line-height:1.62;
    padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));}
  .wrap{max-width:900px; margin:0 auto; padding-inline:18px;}
  /* 答题屏用宽版：左题面右评分，两栏都要够宽 */
  .wrap.wide{max-width:1340px;}
  h1,h2,h3{margin:0; text-wrap:balance}
  code,.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}

  /* ---- top bar ---- */
  .bar{position:sticky; top:0; z-index:20; background:var(--card);
    border-bottom:1px solid var(--rule);
    padding-top:env(safe-area-inset-top,0px);}
  .bar .wrap{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding-block:10px;}
  .bar .title{font-family:"IBM Plex Serif",Georgia,serif; font-weight:600; font-size:16px;}
  .bar .spacer{flex:1}
  .pill{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink2);
    border:1px solid var(--rule); background:var(--sunk); border-radius:3px; padding:2px 8px;}
  #saveState[data-s="saved"]{color:var(--good); border-color:var(--good)}
  #saveState[data-s="saving"]{color:var(--warn); border-color:var(--warn)}
  #saveState[data-s="offline"]{color:#c0392b; border-color:#c0392b}
  #saveState[data-s="preview"]{color:var(--ink3)}
  .track{height:3px; background:var(--sunk)}
  .track > i{display:block; height:100%; width:0; background:var(--accent); transition:width .25s}

  /* ---- panels ---- */
  .panel{background:var(--card); border:1px solid var(--rule2); border-radius:5px;
    box-shadow:var(--shadow); margin:22px 0; padding:22px 18px;}
  .panel h2{font-family:"IBM Plex Serif",Georgia,serif; font-size:20px; margin-bottom:10px}
  .panel p{color:var(--ink2); margin:0 0 .8em}
  .panel p:last-child{margin-bottom:0}

  /* ---- item card ---- */
  .item{background:var(--card); border:1px solid var(--rule2); border-radius:5px;
    box-shadow:var(--shadow); margin:18px 0; overflow:hidden}
  .ihead{display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:11px 16px; background:var(--sunk); border-bottom:1px solid var(--rule)}
  .inum{font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:12.5px}
  .ibody{padding:18px 16px}

  /* ---- 左题面 / 右评分 ---- */
  .stage{display:grid; grid-template-columns:minmax(0,1fr) 400px; gap:0 26px; align-items:start}
  .stage > .rate{
    align-self:start;
    background:var(--sunk); border:1px solid var(--rule); border-radius:5px; padding:14px 15px;
  }
  /* 只有评分栏比题面矮时才跟随滚动：它比题面高的时候，钉住毫无意义，
     反而会把一个本来能一眼看完的表单塞进一个小滚动框里。高度由 JS 量完再定。 */
  .stage > .rate.follow{
    position:sticky; top:calc(env(safe-area-inset-top,0px) + 62px);
    max-height:var(--rate-max, calc(100dvh - 150px));
    overflow-y:auto; overscroll-behavior:contain;
  }
  .stage > .read{min-width:0}
  @media (max-width:1040px){
    .stage{grid-template-columns:1fr; gap:22px 0}
    .stage > .rate, .stage > .rate.follow{position:static; max-height:none; overflow:visible}
  }

  .cmp{display:grid; grid-template-columns:1fr 1fr; gap:0 18px}
  @media (max-width:820px){ .cmp{grid-template-columns:1fr} .col.b{margin-top:22px} }
  .colhead{font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:600;
    letter-spacing:.1em; border-bottom:1px solid var(--rule); padding-bottom:6px; margin-bottom:10px}
  .col.a .colhead{color:var(--a-side)} .col.b .colhead{color:var(--b-side)}
  /* 字段名是读长 schema 时的路标 —— 之前是浅灰小字，扫一眼全糊在一起。
     现在给它实底色块、加重字重、拉开与正文的间距。 */
  .fld{margin-bottom:16px}
  .fld .k{display:inline-block; font-family:"IBM Plex Mono",monospace;
    font-size:10.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
    color:var(--accent); background:var(--accent-soft);
    border-radius:3px; padding:2px 7px; margin-bottom:6px}
  .fld .v{font-size:13.5px; line-height:1.58; padding-left:1px}
  .fld ul{margin:0; padding-left:1.1em} .fld li{margin-bottom:3px}

  .rate .ans{margin-top:16px; padding-top:13px}
  .rate .ans:first-child{margin-top:0; padding-top:0; border-top:none}
  .rate .row{margin-bottom:14px}
  .rate .row .q{flex:1 1 100%}
  .rate .scale{width:100%}
  .rate .scale label{flex:1 1 auto; min-width:44px; padding:5px 6px}
  .ans{margin-top:20px; padding-top:16px; border-top:1px dashed var(--rule2)}
  .ans h4{margin:0 0 10px; font-size:13px; font-family:"IBM Plex Mono",monospace;
    letter-spacing:.08em; text-transform:uppercase; color:var(--ink2); font-weight:600}
  .hint{font-size:13px; color:var(--ink2); margin-bottom:10px}

  .fieldq{border:1px solid var(--rule); border-radius:4px; background:var(--card);
    padding:7px 10px; margin-bottom:7px}
  /* 未填项：点「下一题」时才亮，改完即灭 */
  .missing{outline:2px solid #c0392b; outline-offset:2px; border-radius:4px}
  .missing .fname,.missing .q{color:#c0392b}
  .fieldq .fname{display:inline-block; font-family:"IBM Plex Mono",monospace;
    font-size:10.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
    color:var(--accent); background:var(--accent-soft);
    border-radius:3px; padding:2px 7px; margin-bottom:6px}
  .fieldq .opts{display:flex; gap:12px; flex-wrap:wrap}

  table.grid{width:100%; border-collapse:collapse; font-size:13.5px}
  table.grid th,table.grid td{padding:7px 8px; border-bottom:1px solid var(--rule); text-align:center}
  table.grid th{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink3);
    font-weight:500; text-transform:uppercase}
  table.grid td:first-child,table.grid th:first-child{text-align:left; width:38%}
  table.grid td:first-child{font-family:"IBM Plex Mono",monospace; font-size:12.5px}
  .tscroll{overflow-x:auto}

  .row{display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; margin-bottom:12px}
  .row .q{flex:1 1 260px; font-size:14px}
  .row .q small{display:block; color:var(--ink3); font-size:12.5px; line-height:1.45}
  .scale{display:flex; gap:4px; flex-wrap:wrap}
  .scale label{position:relative; display:flex; flex-direction:column; align-items:center; gap:3px;
    border:1px solid var(--rule2); border-radius:4px; padding:5px 9px; cursor:pointer;
    font-family:"IBM Plex Mono",monospace; font-size:12.5px; color:var(--ink2); background:var(--card)}
  .scale label:hover{border-color:var(--accent); color:var(--accent)}
  .scale label span{font-size:9.5px; color:var(--ink3); text-transform:uppercase}
  .scale input{position:absolute; opacity:0; pointer-events:none}
  .scale label em{font-style:normal}
  .scale label:has(input:checked){background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
  .scale label:has(input:focus-visible){outline:2px solid var(--accent); outline-offset:2px}
  label.opt{display:inline-flex; align-items:center; gap:6px; cursor:pointer; font-size:13.5px; color:var(--ink2)}
  input[type=radio],input[type=checkbox]{accent-color:var(--accent); width:15px; height:15px; margin:0; cursor:pointer}
  input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  textarea,input[type=text]{width:100%; font-family:inherit; font-size:13.5px; color:var(--ink);
    background:var(--sunk); border:1px solid var(--rule2); border-radius:4px; padding:8px 10px}
  textarea{resize:vertical; min-height:52px}

  .note{background:var(--sunk); border:1px solid var(--rule); border-left:3px solid var(--warn);
    border-radius:0 4px 4px 0; padding:12px 14px; margin:14px 0; font-size:13.5px; color:var(--ink2)}
  .note b{color:var(--ink)}

  /* ---- footer nav ---- */
  .nav{position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--card);
    border-top:1px solid var(--rule);
    padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
  .nav .wrap{display:flex; gap:10px; align-items:center}
  button{font-family:inherit; font-size:14px; padding:9px 18px; border-radius:4px;
    border:1px solid var(--rule2); background:var(--card); color:var(--ink); cursor:pointer}
  button:hover:not(:disabled){border-color:var(--accent); color:var(--accent)}
  button:disabled{opacity:.45; cursor:not-allowed}
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  button.primary:hover:not(:disabled){filter:brightness(1.08); color:#fff}
  .nav .spacer{flex:1}
  .nav .count{font-family:"IBM Plex Mono",monospace; font-size:12.5px; color:var(--ink3)}
  .nav .left{font-size:12.5px; color:#c0392b}
</style>
</head>
<body>

<header class="bar">
  <div class="wrap">
    <span class="title"></span>
    <span class="pill" id="codePill" hidden></span>
    <span class="spacer"></span>
    <span class="pill" id="saveState" data-s="preview">未连接</span>
  </div>
  <div class="track"><i id="progressBar"></i></div>
</header>

<main class="wrap" id="main">
  <div class="panel"><p>Loading… 正在载入</p></div>
</main>

<nav class="nav" id="nav" hidden>
  <div class="wrap">
    <button id="btnPrev">← 上一题</button>
    <span class="count" id="counter"></span>
    <span class="left" id="leftCount"></span>
    <span class="spacer"></span>
    <button id="btnNext" class="primary">下一题 →</button>
    <button id="btnFinish" class="primary" hidden>提交问卷</button>
  </div>
</nav>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
